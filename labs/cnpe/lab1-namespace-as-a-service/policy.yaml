---
# Auto-generates ResourceQuota in every new namespace
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-resourcequota
  annotations:
    policies.kyverno.io/title: Generate ResourceQuota
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      Platform guardrail: every new namespace gets a default ResourceQuota
      so no team can starve the cluster.
spec:
  rules:
    - name: generate-resourcequota
      match:
        any:
          - resources:
              kinds:
                - Namespace
      generate:
        apiVersion: v1
        kind: ResourceQuota
        name: default-quota
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          metadata:
            labels:
              generated-by: kyverno
          spec:
            hard:
              pods: "10"
              requests.cpu: "2"
              requests.memory: 2Gi
              limits.cpu: "4"
              limits.memory: 4Gi
---
# Auto-generates LimitRange in every new namespace
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-limitrange
  annotations:
    policies.kyverno.io/title: Generate LimitRange
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: >-
      Sets default container requests/limits so pods without explicit
      resource specs still get bounded.
spec:
  rules:
    - name: generate-limitrange
      match:
        any:
          - resources:
              kinds:
                - Namespace
      generate:
        apiVersion: v1
        kind: LimitRange
        name: default-limits
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          metadata:
            labels:
              generated-by: kyverno
          spec:
            limits:
              - type: Container
                default:
                  cpu: "500m"
                  memory: "256Mi"
                defaultRequest:
                  cpu: "100m"
                  memory: "128Mi"
                max:
                  cpu: "2"
                  memory: "2Gi"
