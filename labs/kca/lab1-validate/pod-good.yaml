# This pod has resource limits — should be ALLOWED by Kyverno
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: kyverno-test
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
