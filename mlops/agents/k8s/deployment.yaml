apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-agent
  namespace: apps
  labels:
    app: devops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-agent
  template:
    metadata:
      labels:
        app: devops-agent
    spec:
      containers:
        - name: devops-agent
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_HOST
              value: "http://ollama.ollama.svc.cluster.local:11434"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: devops-agent
  namespace: apps
spec:
  selector:
    app: devops-agent
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
